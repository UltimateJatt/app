# Netlify build settings for the NFL Fantasy Box Pool app.
# Having this file means you do not have to type the build command
# or publish directory into the Netlify UI, and it stays correct
# if the site is ever rebuilt from scratch.

[build]
  # Deletes any node_modules that came from the repo before installing.
  # Files installed on Windows arrive without the Linux "executable"
  # permission, which makes vite fail with "Permission denied". Starting
  # from a clean install sidesteps that no matter what is committed.
  command = "rm -rf node_modules && npm install --no-audit --no-fund && npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The app is a single page. Any path the browser asks for must be
# answered with index.html, or a refresh on a sub-path 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The bundle filename changes on every build, so it can be cached
# hard. index.html must never be cached, or people keep loading an
# old build after you deploy a fix.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
